<div class="layout"><aside class="side" id="sidebar" aria-label="Lesson progress"><div class="sidehead"><span class="eyebrow">YOUR LEARNING PATH</span><h2>Paper or Digital?</h2><p>Compare two ways to keep information organized.</p></div><div class="sideprogress"><div class="prowtxt"><span id="proglabel">Register to begin</span><span id="progpercent">0%</span></div><div class="progressbar" role="progressbar" aria-label="Required lesson task completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><span id="progfill"></span></div></div><nav class="stepnav" id="stepnav"></nav></aside><main class="maincol" id="maincol"><div class="mainhead"><span class="path" id="breadcrumb">Grade 3 / Unit 3 / Week 14</span><span class="taskno" id="taskno">Welcome</span></div><section class="panel" id="panel" aria-live="polite"></section><div id="footerNav" class="footerNav hidden"></div></main></div>
<script>
'use strict';
// Entire lesson works in this browser; no account, analytics, backend, or external library.
const steps=[
{id:'goals',title:'Learning goals',group:'START'},
{id:'typing',title:'Typing zone',group:'START'},
{id:'warmup',title:'Library mystery',group:'START'},
{id:'learn1',title:'What is a database?',group:'LEARN'},
{id:'learn2',title:'Physical databases',group:'LEARN'},
{id:'learn3',title:'Digital databases',group:'LEARN'},
{id:'learn4',title:'Paper vs digital',group:'LEARN'},
{id:'learn5',title:'Fields and records',group:'LEARN'},
{id:'sort',title:'Sort the examples',group:'PRACTISE'},
{id:'builder',title:'Digital library lab',group:'PRACTISE'},
{id:'quiz',title:'10-question quiz',group:'CHECK'},
{id:'reflection',title:'Exit ticket',group:'CHECK'},
{id:'homework',title:'Homework & challenge',group:'FINISH'},
{id:'results',title:'Results & Excel file',group:'FINISH'}
];
const totalRequired=steps.length-1;
const sortItems=[
{id:'s1',text:'Library borrowing cards',type:'paper'},
{id:'s2',text:'Excel library book list',type:'digital'},
{id:'s3',text:'Printed attendance register',type:'paper'},
{id:'s4',text:'School library computer system',type:'digital'},
{id:'s5',text:'Filing cabinet of student forms',type:'paper'},
{id:'s6',text:'Contact list on a phone',type:'digital'},
{id:'s7',text:'Notebook of contact names',type:'paper'},
{id:'s8',text:'Digital attendance system',type:'digital'},
{id:'s9',text:'Paper club membership cards',type:'paper'},
{id:'s10',text:'Spreadsheet of school records',type:'digital'}
];
const questions=[
{q:'What is a database?',a:['A drawing program','An organized collection of information','A printer cable','A keyboard shortcut'],correct:1,why:'A database keeps information organized so it can be used later.'},
{q:'Which example is a physical database?',a:['A phone contacts app','A school website','A drawer of paper library cards','A spreadsheet'],correct:2,why:'Paper library cards are physical records.'},
{q:'Which example is a digital database?',a:['A printed class register','An Excel list of books','A handwritten notebook','Paper membership cards'],correct:1,why:'An Excel book list stores records electronically.'},
{q:'Where are physical database records stored?',a:['In paper files and folders','Only on the internet','In a computer folder','Only in an app'],correct:0,why:'Physical databases use paper, cards, files, and folders.'},
{q:'What is one advantage of paper records?',a:['They always search automatically','They use no physical space','They never get lost','You can read them without electricity'],correct:3,why:'Paper can be used even when no computer is available.'},
{q:'What is one disadvantage of a large paper database?',a:['It cannot contain words','It may need lots of storage space','It uses no paper','It always sorts itself'],correct:1,why:'Thousands of paper records can fill folders and cabinets.'},
{q:'You need to find one book among 1,000. Which is usually quicker?',a:['Read every card in turn','Count the shelves','Search a digital library database','Rewrite the cards'],correct:2,why:'Digital search can find matching records quickly.'},
{q:'How can you update a digital book record?',a:['Find its row, edit the information, and save','Buy another filing cabinet','Erase a paper card','Print the whole list every time'],correct:0,why:'You can change electronic information and save it.'},
{q:'In a book database, what is one record?',a:['The whole computer','The heading Book Title','A search button','One row with information about one book'],correct:3,why:'One record is a complete entry, such as one book row.'},
{q:'Which statement is correct?',a:['All databases need the internet','Digital databases can often search and sort quickly','Paper cards do not store information','Digital records never need checking'],correct:1,why:'Digital databases often offer quick searching and sorting.'}
];
const startingBooks=[
{title:'Space Quest',category:'Science',copies:3},
{title:'Funny Cats',category:'Stories',copies:5},
{title:'Ocean World',category:'Science',copies:2},
{title:'Magic Forest',category:'Stories',copies:4}
];
const state={step:-1,name:'',className:'',completed:{},typed:'',typingChecked:false,warmup:'',sort:{},sortChecked:false,books:startingBooks.map(x=>({...x})),query:'',searched:false,sortAz:false,quizAnswers:Array(10).fill(null),quizIndex:0,quizSubmitted:false,reflection:'',choice:'',homeAcknowledged:false,feedback:''};
const $=id=>document.getElementById(id);
function h(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cleanName(n){let x=String(n||'Student');try{x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(e){}return (x.replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60)||'Student');}
function nowDate(){return new Date().toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'});}
function completedCount(){return steps.slice(0,-1).filter(x=>state.completed[x.id]).length;}
function scoreSort(){return sortItems.filter(x=>state.sort[x.id]===x.type).length;}
function scoreQuiz(){return questions.filter((q,i)=>state.quizAnswers[i]===q.correct).length;}
function status(text='',kind=''){state.feedback=text;const box=$('statusMsg');if(box){box.className='status '+kind;box.textContent=text;}}
function invalidate(id){delete state.completed[id];if(id==='sort')state.sortChecked=false;if(id==='quiz')state.quizSubmitted=false;}
function canGoTo(i){return i>=0&&i<steps.length&&(i<=state.step||!!state.completed[steps[i].id]||(i===steps.length-1&&completedCount()===totalRequired));}
function goto(i){if(!canGoTo(i))return;state.step=i;state.feedback='';render();window.scrollTo({top:0,behavior:'instant'});}
function setStep(i){state.step=i;state.feedback='';render();window.scrollTo({top:0,behavior:'instant'});}
function validateCurrent(){const id=steps[state.step]?.id;if(!id)return false;
if(id==='typing'&&(!state.typingChecked||state.typed.trim().length<10)){status('Type a sentence and click Check Typing first.','error');return false;}
if(id==='warmup'&&state.warmup.trim().length<12){status('Write at least one sentence to explain your choice.','error');return false;}
if(id==='sort'&&(!state.sortChecked||sortItems.some(x=>!state.sort[x.id]))){status('Sort all 10 examples, then click Check My Sorting.','error');return false;}
if(id==='builder'&&(!state.searched||state.books.length<6)){status('Add at least two books and use the Search button before continuing.','error');return false;}
if(id==='quiz'&&!state.quizSubmitted){status('Answer all 10 questions and submit your quiz.','error');return false;}
if(id==='reflection'&&(state.reflection.trim().length<15||!state.choice)){status('Choose your database and write your reason (at least one sentence).','error');return false;}
if(id==='homework'&&!state.homeAcknowledged){status('Tick the box to show you understand how to submit homework.','error');return false;}
return true;}
function nextStage(){if(state.step<0){startLesson();return;}if(!validateCurrent())return;state.completed[steps[state.step].id]=true;if(state.step<steps.length-1)setStep(state.step+1);}
function previousStage(){if(state.step>0)setStep(state.step-1);else if(state.step===0){state.step=-1;render();}}
function render(){const logged=state.step>=0;$('userChip').textContent=logged?`${state.className} · ${state.name}`:'Student lesson';$('editDetails').classList.toggle('hidden',!logged);const count=completedCount(),pct=Math.round(count/totalRequired*100);$('proglabel').textContent=logged?`${count} of ${totalRequired} tasks complete`:'Register to begin';$('progpercent').textContent=pct+'%';$('progfill').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);$('stepnav').innerHTML=steps.map((x,i)=>`<button type="button" class="steplink ${i===state.step?'current':state.completed[x.id]?'done':''}" ${canGoTo(i)?'':'disabled'} data-goto="${i}" title="${h(x.title)}"><span class="num">${state.completed[x.id]?'✓':i+1}</span><span>${h(x.title)}</span></button>`).join('');$('taskno').textContent=logged?`Task ${state.step+1} of ${steps.length}`:'Before we begin';$('breadcrumb').textContent=logged?`GRADE 3 / UNIT 3 / WEEK 14 / ${steps[state.step].group}`:'GRADE 3 / UNIT 3 / WEEK 14';
const page=logged?renderStage(steps[state.step].id):registrationHtml();$('panel').innerHTML=page+'<div id="statusMsg" class="status" role="status" aria-live="polite"></div>';if(state.feedback)status(state.feedback);renderFooter();}
function renderFooter(){if(state.step<0){$('footerNav').classList.add('hidden');$('footerNav').innerHTML='';return;}$('footerNav').classList.remove('hidden');const last=state.step===steps.length-1;const prev=`<button type="button" class="btn ghost" data-action="previous">← Previous</button>`;const next=last?'':`<button type="button" class="btn" data-action="next">${state.step===steps.length-2?'View My Results →':'Next Task →'}</button>`;$('footerNav').innerHTML=prev+`<span class="centerNote">Your answers stay in this browser until you download them.</span>`+next;}

case 'learn2':return `<span class="subtitle">💡 LEARN · PART 2</span><h1>📁 Physical databases</h1><p class="lead">A <strong>physical database</strong> keeps information on paper.</p><div class="twocol"><div class="tile paper"><div class="emoji">📇</div><h3>Example</h3><p>A librarian keeps borrowing cards in a drawer.</p></div><div class="tile paper"><div class="emoji">🗄️</div><h3>Other examples</h3><p>Printed attendance registers and student forms in a filing cabinet.</p></div></div><div class="callout success">✅ <strong>Good:</strong> A paper record can be read without a computer or electricity.</div><div class="callout orange">⚠️ <strong>Limit:</strong> Many cards need space. Finding the right card may take time.</div>`;

case 'learn5':return `<span class="subtitle">💡 LEARN · PART 5</span><h1>Fields and records</h1><p class="lead">Let's look at a digital class library table.</p><div class="tablewrap"><table class="lessonTable"><thead><tr><th>Book Title</th><th>Category</th><th>Copies</th></tr></thead><tbody><tr><td>Space Quest</td><td>Science</td><td>3</td></tr><tr><td>Funny Cats</td><td>Stories</td><td>5</td></tr><tr><td>Ocean World</td><td>Science</td><td>2</td></tr><tr><td>Magic Forest</td><td>Stories</td><td>4</td></tr></tbody></table></div><div class="twocol"><div class="tile"><h3>🔑 Field</h3><p>One type of information in a <strong>column</strong>.</p><span class="tag">Example: Category</span></div><div class="tile"><h3>🔑 Record</h3><p>One complete entry in a <strong>row</strong>.</p><span class="tag">Example: Funny Cats · Stories · 5</span></div></div><div class="callout orange"><strong>⚠️ Common mistake:</strong> A field is a column. A record is a row. Keep text in text fields and numbers in the Copies field.</div>`;

case 'quiz':return quizHtml();
case 'reflection':return `<span class="subtitle">📝 EXIT TICKET · 2 MINUTES</span><h1>What did you learn?</h1><p class="lead">Your teacher will read your explanation. There is no automatic score for this written answer.</p><label for="refchoice" class="field">Which database would you use for a school library with 1,000 books?</label><select id="refchoice" class="select"><option value="">Choose one</option>${['Digital database','Physical (paper) database','Either could work'].map(x=>`<option ${state.choice===x?'selected':''}>${x}</option>`).join('')}</select><label for="reflectionText" class="field">Explain your choice in one or two sentences.</label><textarea id="reflectionText" class="textinput" placeholder="I would choose… because…">${h(state.reflection)}</textarea><p class="fineprint">Think about space, searching, and whether a working computer is available.</p>`;
case 'homework':return `<span class="subtitle">🏠 HOMEWORK & OPTIONAL CHALLENGE</span><h1>Database hunt at home</h1><p class="lead">This activity is completed <strong>outside</strong> this website. Do not say it is done until you submit it in VinSchool LMS.</p><div class="tile"><h3>🏠 Homework · 10–15 minutes</h3><ol class="listclean"><li>Find <strong>one paper record</strong> at home, such as a paper contact list.</li><li>Find <strong>one digital record</strong>, such as a phone contact list.</li><li>Explain where each stores information.</li><li>Write which would be easier to search and why.</li><li>Type your answers in your <strong>Week 14 Homework</strong> assignment in VinSchool LMS.</li></ol><p class="subtle">🔒 Do not share private names, phone numbers, addresses, or photographs of personal records.</p></div><div class="tile" style="margin-top:12px"><h3>🏆 Optional challenge: Be a library detective</h3><p>Make three <strong>paper library cards</strong> using books from the digital table you created. Compare how you find a book using paper cards versus a digital search.</p><p><strong>⭐ Bonus:</strong> Explain one reason a school might still keep paper records.</p></div><div class="tile digital" style="margin-top:12px"><h3>💻 Optional Microsoft Excel activity</h3><p>Recreate your class library table in Excel with the field names <strong>Book Title, Category, Copies</strong> and at least six books. Save it as <strong>G3_W14_Library_YourName.xlsx</strong> and upload it if your teacher has assigned the separate Excel classwork.</p></div><label class="checkline"><input id="homeAcknowledged" class="checkinput" type="checkbox" ${state.homeAcknowledged?'checked':''}><span><strong>I know what to do for homework.</strong> I understand that it must be submitted separately in VinSchool LMS.</span></label>`;

function sortHtml(){const renderCard=x=>{const target=state.sort[x.id];return `<div class="dragcard" draggable="true" data-card="${x.id}" aria-label="${h(x.text)}; drag or use buttons"><span class="grab" aria-hidden="true">⠿</span><span class="cardtxt">${h(x.text)}</span><span class="choiceBtns"><button type="button" class="chipbutton" data-place="${x.id}" data-bucket="paper" aria-label="Place ${h(x.text)} in paper">📁</button><button type="button" class="chipbutton" data-place="${x.id}" data-bucket="digital" aria-label="Place ${h(x.text)} in digital">💻</button></span></div>`;};const inBucket=type=>sortItems.filter(x=>state.sort[x.id]===type).map(renderCard).join('');const unsorted=sortItems.filter(x=>!state.sort[x.id]);return `<span class="subtitle">🎯 PRACTICE 1 · SORTING · ABOUT 5 MINUTES</span><h1>Paper or digital?</h1><p class="lead">Move each example to the correct table. <strong>Drag a card</strong> or tap its 📁 / 💻 button.</p><p><span class="pill">${sortItems.length-unsorted.length} of ${sortItems.length} placed</span> <span class="pill">Keyboard / touch-friendly buttons included</span></p><div class="bank"><h3>🃏 Cards to sort</h3><div class="cards">${unsorted.length?unsorted.map(renderCard).join(''):'<span class="subtle">All cards have been placed. Check your answers!</span>'}</div></div><div class="sortboard"><div class="dropzone" data-bucket="paper" tabindex="0" aria-label="Physical paper database drop zone"><h3>📁 Paper-based database</h3><p class="subtle">Records on paper, cards or forms</p><div class="cards">${inBucket('paper')||'<span class="subtle">Drop or tap to add cards</span>'}</div></div><div class="dropzone" data-bucket="digital" tabindex="0" aria-label="Digital database drop zone"><h3>💻 Digital database</h3><p class="subtle">Electronic records on a device</p><div class="cards">${inBucket('digital')||'<span class="subtle">Drop or tap to add cards</span>'}</div></div></div><div class="actions"><button type="button" class="btn secondary" data-action="checkSort" ${unsorted.length?'disabled':''}>✔ Check My Sorting</button><button type="button" class="btn ghost" data-action="resetSort">↻ Start Again</button></div>${state.sortChecked?`<div class="sortfeedback"><strong>${scoreSort()} / 10 correct</strong><p>${scoreSort()===10?'Excellent! Every example is in the right place.':'Look at the examples below and move any cards you want to correct.'}</p><p class="small">${sortItems.filter(x=>state.sort[x.id]!==x.type).map(x=>`${h(x.text)} → ${x.type==='paper'?'Paper':'Digital'}`).join('<br>')||'All answers are correct.'}</p></div>`:''}`;}
function builderHtml(){let books=[...state.books];if(state.sortAz)books.sort((a,b)=>a.title.localeCompare(b.title));const display=state.searched&&state.query.trim()?books.filter(x=>x.title.toLowerCase().includes(state.query.toLowerCase().trim())):books;return `<span class="subtitle">💻 PRACTICE 2 · DIGITAL LIBRARY · ABOUT 5 MINUTES</span><h1>Build and search a book list</h1><p class="lead">A digital library can hold book records. Add <strong>two more</strong> books, then try searching.</p><div class="callout"><strong>Excel example:</strong> A1 = Book Title · B1 = Category · C1 = Copies. Every book is one record.</div><div class="tablewrap"><table class="lessonTable"><thead><tr><th>Book Title</th><th>Category</th><th>Copies</th></tr></thead><tbody>${display.map(x=>`<tr><td>${h(x.title)}</td><td>${h(x.category)}</td><td class="digit">${x.copies}</td></tr>`).join('')||'<tr><td colspan="3">No matching books. Try another search.</td></tr>'}</tbody></table></div><p><span class="tag">${state.books.length} records saved in this lesson</span> ${state.searched?`<span class="tag">${display.length} matching record(s)</span>`:''}</p><div class="tile"><h3>➕ Add one book record</h3><div class="rowentry"><label>Book Title<input id="newTitle" class="smallinput" maxlength="60" placeholder="e.g. Moon Walk"></label><label>Category<input id="newCategory" class="smallinput" maxlength="30" placeholder="e.g. Science"></label><label>Copies<input id="newCopies" class="smallinput" type="number" min="1" max="999" placeholder="2"></label><button class="btn small" type="button" data-action="addBook">Add Book</button></div><p class="fineprint">Use your own book titles. You need at least 6 records.</p></div><div class="tile digital" style="margin-top:14px"><h3>🔍 Search and sort your records</h3><label class="field" for="bookSearch">Search by book title</label><div class="searchbar"><input class="input" id="bookSearch" value="${h(state.query)}" placeholder="Try Ocean or Cats"><button class="btn small" type="button" data-action="searchBooks">Search</button><button class="btn ghost small" type="button" data-action="clearSearch">Show All</button></div><button class="btn secondary small" data-action="toggleSort" type="button">${state.sortAz?'Show original order':'Sort titles A–Z'}</button><span style="padding-left:8px" class="subtle">${state.searched?'Search used ✓':'Search not used yet'}</span></div>`;}
function quizHtml(){if(state.quizSubmitted){return `<span class="subtitle">🎮 REVIEW QUIZ · COMPLETE</span><h1>Database Detective Results</h1><div class="scorebig">${scoreQuiz()} / ${questions.length}</div><p class="lead">${scoreQuiz()===10?'Wonderful! You know how the two databases work.':'Nice effort! Review the explanations to improve your learning.'}</p><div class="tablewrap"><table class="lessonTable"><thead><tr><th>#</th><th>Your answer</th><th>Result</th></tr></thead><tbody>${questions.map((q,i)=>`<tr><td>${i+1}</td><td>${h(q.a[state.quizAnswers[i]])}</td><td>${state.quizAnswers[i]===q.correct?'✅ Correct':`❌ ${h(q.a[q.correct])}<div class="subtle">${h(q.why)}</div>`}</td></tr>`).join('')}</tbody></table></div><button class="btn secondary" data-action="retryQuiz" type="button">↻ Retry the Quiz</button><p class="fineprint">Your newest submitted attempt will appear in the Excel results.</p>`;}
const q=questions[state.quizIndex];return `<span class="subtitle">🎮 REVIEW QUIZ · ABOUT 6 MINUTES</span><h1>Database Detective Quiz</h1><p class="lead">Choose one answer for each question. All 10 are required before submission.</p><div class="progressbar" role="progressbar" aria-label="Quiz questions answered" aria-valuenow="${state.quizAnswers.filter(x=>x!==null).length*10}" aria-valuemin="0" aria-valuemax="100"><span style="width:${state.quizAnswers.filter(x=>x!==null).length*10}%"></span></div><div class="qbox"><div class="qnum">Question ${state.quizIndex+1} of ${questions.length}</div><div class="qquestion">${h(q.q)}</div>${q.a.map((ans,i)=>`<button type="button" class="option ${state.quizAnswers[state.quizIndex]===i?'picked':''}" data-option="${i}" aria-pressed="${state.quizAnswers[state.quizIndex]===i?'true':'false'}"><span class="letter">${i+1}</span><span>${h(ans)}</span></button>`).join('')}</div><div class="actions"><button type="button" class="btn ghost" data-action="quizPrev" ${state.quizIndex===0?'disabled':''}>← Previous Question</button>${state.quizIndex<questions.length-1?`<button type="button" class="btn secondary" data-action="quizNext">Next Question →</button>`:`<button type="button" class="btn green" data-action="submitQuiz" ${state.quizAnswers.some(x=>x===null)?'disabled':''}>Submit My Quiz ✓</button>`}</div><p class="fineprint">${state.quizAnswers.filter(x=>x!==null).length} of 10 answered. Go back to change an answer before submitting.</p>`;}
function resultsHtml(){const done=completedCount()===totalRequired,objective=scoreSort()+scoreQuiz();return `<span class="subtitle">🎉 WELL DONE · FINAL RESULTS</span><h1>Your Database Detective Report</h1><p class="lead">Great work, <strong>${h(state.name)}</strong> from <strong>${h(state.className)}</strong>! Download your Excel results for VinSchool LMS.</p><div class="resultsGrid"><div class="metric"><div class="value">${completedCount()} / ${totalRequired}</div><div class="lbl">Required tasks done</div></div><div class="metric"><div class="value">${scoreQuiz()} / 10</div><div class="lbl">Quiz score</div></div><div class="metric"><div class="value">${objective} / 20</div><div class="lbl">Objective checks only</div></div></div><div class="callout success"><strong>📚 Your learning summary</strong><p><strong>Sorting:</strong> ${scoreSort()}/10 correct. <strong>Book records:</strong> ${state.books.length}. <strong>Quiz:</strong> ${scoreQuiz()}/10 correct.</p><p><strong>Reflection:</strong> ${h(state.choice)} — ${h(state.reflection)}</p><p class="subtle">Your written answers and practical work need teacher review. The ${objective}/20 is not your overall ICT grade.</p></div><div class="actions"><button class="btn green" data-action="download" type="button" ${done?'':'disabled'}>⬇ DOWNLOAD MY EXCEL RESULTS (.XLSX)</button></div><p class="fineprint">The file contains five worksheets: Student Information, Activity Results, Quiz Results, Reflection, and Summary.</p><div class="tile digital" style="margin-top:22px"><h3>📤 Submit Your Work to VinSchool LMS</h3><ol class="listclean"><li>Click <strong>Download My Excel Results</strong>.</li><li>Find the downloaded <strong>.xlsx</strong> file on your computer.</li><li>Open <strong>VinSchool LMS</strong> and find your <strong>Week 14 Interactive Lesson</strong> assignment.</li><li>Upload the Excel file and click <strong>Submit Assignment</strong>.</li><li>Check that VinSchool LMS shows a successful submission.</li></ol><div class="callout orange"><strong>Important:</strong> Downloading a file does not submit it. Your task is finished only after your teacher receives the file through VinSchool LMS.</div></div><p class="fineprint">🔒 Your results are created locally in this browser. No student information is sent to GitHub or any other server.</p>`;}

// Events are delegated so re-rendering never breaks buttons or fields.
document.addEventListener('click',e=>{const act=e.target.closest('[data-action]');const step=e.target.closest('[data-goto]');const place=e.target.closest('[data-place]');if(step){goto(Number(step.dataset.goto));return;}if(place){state.sort[place.dataset.place]=place.dataset.bucket;invalidate('sort');render();return;}if(!act)return;const kind=act.dataset.action;
switch(kind){case 'start':startLesson();break;case 'next':nextStage();break;case 'previous':previousStage();break;
case 'checkTyping':{const src='A database stores information. Paper records are kept in folders. Digital records can be searched.';const normalized=state.typed.replace(/\s+/g,' ').trim();if(normalized.length<10){status('Type at least one of the sentences first.','error');break;}state.typingChecked=true;const arr=[...src],n=[...normalized];let equal=0;for(let i=0;i<Math.min(arr.length,n.length);i++)if(arr[i].toLowerCase()===n[i].toLowerCase())equal++;const approx=Math.round(100*equal/Math.max(arr.length,n.length));$('typingResult').textContent=`Typing checked ✓ · about ${approx}% match`;status('Good practice! Check capitals, spaces, and punctuation before you continue.','good');break;}
case 'checkSort':if(sortItems.every(x=>state.sort[x.id])){state.sortChecked=true;render();status(`You placed all 10 cards. ${scoreSort()} are correct. You may correct any card and check again.`,'good');}break;
case 'resetSort':state.sort={};invalidate('sort');render();break;
case 'addBook':{const title=$('newTitle').value.trim(),category=$('newCategory').value.trim(),cp=Number($('newCopies').value);if(!title||!category||!Number.isInteger(cp)||cp<1||cp>999){status('Please enter a title, a category, and a whole-number Copies value from 1 to 999.','error');break;}if(state.books.length>=24){status('This practice table holds up to 24 records.','error');break;}state.books.push({title,category,copies:cp});invalidate('builder');render();status(`Added “${title}”. You now have ${state.books.length} book records.`,'good');break;}
case 'searchBooks':state.query=$('bookSearch').value;state.searched=true;invalidate('builder');render();status(`Your search is complete. ${state.books.filter(x=>x.title.toLowerCase().includes(state.query.toLowerCase().trim())).length} match(es) found.`,'good');break;
case 'clearSearch':state.query='';state.searched=false;invalidate('builder');render();break;
case 'toggleSort':state.sortAz=!state.sortAz;render();break;
case 'quizNext':if(state.quizIndex<questions.length-1){state.quizIndex++;render();}break;
case 'quizPrev':if(state.quizIndex>0){state.quizIndex--;render();}break;
case 'submitQuiz':if(state.quizAnswers.every(x=>x!==null)){state.quizSubmitted=true;render();}else status('Please answer all 10 questions.','error');break;
case 'retryQuiz':state.quizAnswers=Array(10).fill(null);state.quizIndex=0;invalidate('quiz');render();break;
case 'download':if(completedCount()===totalRequired)downloadWorkbook();break;
}
});
